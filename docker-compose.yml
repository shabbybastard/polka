services:
  polka:
    image: ghcr.io/shabbybastard/polka:${POLKA_TAG:-latest}
    pull_policy: always
    ports:
      - "12791:12791"
    volumes:
      - ${DATA_DIR}:/data
      - ${BOOKS_DIR}:/books
    environment:
      # Optional: enables the long-polling Telegram bot.
      POLKA_TELEGRAM_TOKEN: ${POLKA_TELEGRAM_TOKEN:-}
    restart: unless-stopped
