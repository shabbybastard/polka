name: CI

on:
  push:
    branches: [main]
  pull_request:

# nodynamic: JPEG XL covers decode via the pure-Go wazero backend (no
# purego/CGO), keeping the build CGO-free on every target.
env:
  GOFLAGS: -tags=nodynamic

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Test frontend
        # The github-actions reporter turns failures into annotations, so
        # the failing test's name is visible without access to job logs.
        run: cd web && npm test -- --reporter=default --reporter=github-actions

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o bin/polka ./cmd/polka

  docker-smoke:
    # Catch Dockerfile/arm64 regressions on main, not only on a release tag.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=polka-docker
          cache-to: type=gha,mode=max,scope=polka-docker
